name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/ci.db
      INFERENCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - name: HTTP authentication and isolation
        run: |
          npm start > /tmp/atelier-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/auth >/dev/null; then break; fi
            sleep 1
          done
          ATELIER_TEST_URL=http://localhost:3000 python3 tests/auth-http.py
